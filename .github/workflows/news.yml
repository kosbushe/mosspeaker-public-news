name: Refresh public news
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    paths: ['collect.php', 'news-library.php', '.github/workflows/news.yml']
permissions:
  contents: write
concurrency:
  group: public-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Ensure PHP extensions
        run: |
          if ! php -r 'exit(extension_loaded("curl") && extension_loaded("dom") && extension_loaded("mbstring") ? 0 : 1);'; then
            sudo apt-get update -qq
            sudo apt-get install -y php-cli php-curl php-xml php-mbstring
          fi
      - name: Read public channels
        run: php collect.php
      - name: Save public headlines
        run: |
          git config user.name 'Mosspeaker public news'
          git config user.email 'news-bot@users.noreply.github.com'
          git add feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public club and park headlines'
            git push
          fi
